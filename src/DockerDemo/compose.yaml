services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dockerdemo-api
    ports:
      - "8080:8080"
    environment:
      ConnectionStrings__DefaultConnection: "Host=db;Port=5432;Database=appdb;Username=appuser;Password=devpassword123"
    depends_on:
      - db
  db:
    image: postgres:17
    container_name: postgres-demo
    environment:
      POSTGRES_USER: appuser
      POSTGRES_PASSWORD: devpassword123
      POSTGRES_DB: appdb
    ports:
      - "5432:5432"
    volumes:
      - postgres-data-clean:/var/lib/postgresql/data

volumes:
  postgres-data-clean:
    external: true
